name: Build Blue Big Fish V86 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'V86-part-*'
      - '.github/workflows/build-apk-v86.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild V86 ZIP
        run: |
          cat V86-part-00 V86-part-01 V86-part-02 V86-part-03 V86-part-04 V86-part-05 > V86.zip
          unzip -t V86.zip
          mkdir source
          unzip -q V86.zip -d source

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/source" \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs dirname)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          APK_PATH=$(find "$PROJECT_DIR" -type f -name app-debug.apk -print -quit)
          test -n "$APK_PATH"
          cp "$APK_PATH" output/blue-big-fish-v86.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blue-big-fish-v86-apk
          path: output/blue-big-fish-v86.apk
